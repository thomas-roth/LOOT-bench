# TODO: when benchmarks ready add extra parts from https://github.com/mujocolab/anymal_c_velocity/tree/main

[project]
name = "g3a-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "pre-commit>=3.7.1",
    "pyright[nodejs]>=1.1.409",
    "ruff>=0.15.13",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "mjlab[cpu]>=1.4.0",
]
cu128 = [
    "torch",
    "mjlab[cu128]>=1.4.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
