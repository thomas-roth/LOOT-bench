# TODO: when benchmarks ready add extra parts from https://github.com/mujocolab/anymal_c_velocity/tree/main

[project]
name = "g3a-bench"
version = "0.1.0"
description = "Long-horizon robot manipulation benchmark tasks (TRLC-DK1, mjlab)"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "lerobot>=0.4.4",
    "mjlab>=1.4.0",
    "torch",
    "torchvision",
    "pre-commit>=3.7.1",
    "pyright[nodejs]>=1.1.409",
    "ruff>=0.15.15",
    "lerobot-robot-trlc-dk1",
    "snakeviz>=2.2.2",
    "pyqt5>=5.15.11",
]

[project.scripts]
g3a-train = "g3a_bench.scripts.train:main"
g3a-play = "g3a_bench.scripts.play:main"
g3a-train-qcfql = "g3a_bench.scripts.qc_fql.scripts.train_qcfql:main"
g3a-play-qcfql = "g3a_bench.scripts.qc_fql.scripts.play_qcfql:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["g3a_bench"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Default to cu128 on Linux/Windows, cpu on macOS (no CUDA wheels exist there).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
lerobot-robot-trlc-dk1 = { git = "https://github.com/robot-learning-co/trlc-dk1" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # mjlab decorates its math helpers with torch.jit.script, which newer torch deprecates.
    "ignore:.*torch\\.jit\\.script.* is deprecated.*:DeprecationWarning",
    # lerobot's stats histograms coerce our (intentional) bool success/done features.
    "ignore:Converting input from bool to <class 'numpy.uint8'> for compatibility:RuntimeWarning",
    # hf datasets calls float() on (1,)-shaped scalar features (numpy>=1.25 deprecation, upstream code).
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning",
]
