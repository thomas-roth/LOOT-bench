[project]
name = "loot-bench"
version = "0.1.0"
description = "Long-horizon robot manipulation benchmark tasks (TRLC-DK1, mjlab)"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    # Direct: loot_bench/qc/env.py is a gymnasium.Env. It arrives via mjlab too,
    # but the qc adapter is not willing to depend on that staying true.
    "gymnasium>=1.0",
    "lerobot[dataset]>=0.6.0",
    # Upper bound is a hard constraint: mjlab 1.6.0 rejects the DK1 collision spec.
    "mjlab>=1.5.1,<1.6",
    "torch",
    "torchvision",
    "pre-commit>=4.6.0",
    "pyright[nodejs]>=1.1.409",
    "ruff>=0.15.22",
    "lerobot-robot-trlc-dk1>=0.3.0",
    "snakeviz>=2.2.2",
    "pyqt5>=5.15.11",
]

[project.scripts]
loot-play = "loot_bench.scripts.play:main"
loot-list-tasks = "loot_bench.scripts.list_tasks:main"
loot-record-demos = "loot_bench.scripts.live_bridge.live_record:main"
loot-convert-demos = "loot_bench.qc.convert:main"
loot-split-demos = "loot_bench.scripts.split_demos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loot_bench"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
# Default to cu128 on Linux/Windows, cpu on macOS (no CUDA wheels exist there).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
lerobot-robot-trlc-dk1 = { git = "https://github.com/robot-learning-co/trlc-dk1" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # mjlab decorates its math helpers with torch.jit.script, which newer torch deprecates.
    "ignore:.*torch\\.jit\\.script.* is deprecated.*:DeprecationWarning",
    # lerobot's stats histograms coerce our (intentional) bool success/done features.
    "ignore:Converting input from bool to <class 'numpy.uint8'> for compatibility:RuntimeWarning",
    # hf datasets calls float() on (1,)-shaped scalar features (numpy>=1.25 deprecation, upstream code).
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning",
]
