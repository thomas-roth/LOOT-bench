repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --config ruff.toml
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright --project pyrightconfig.json
        language: system
        pass_filenames: false
        types: [python]
