repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        description: "Run 'ruff check' for extremely fast Python linting"
        entry: uv run ruff check --force-exclude --config ruff.toml
        language: python
        types_or: [python, pyi, pyproject]
        args: [--fix]
      - id: ruff-format
        name: ruff format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: uv run ruff format --force-exclude --config ruff.toml
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        description: 'Python command line wrapper for pyright, a static type checker'
        entry: uv run pyright --project pyrightconfig.json
        language: system
        types_or: [python, pyi]
        pass_filenames: false
